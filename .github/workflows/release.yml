name: Trusted macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: trusted-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_source:
    name: Validate source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      numeric_version: ${{ steps.metadata.outputs.numeric-version }}
      bundle_version: ${{ steps.metadata.outputs.bundle-version }}
      artifact_name: ${{ steps.metadata.outputs.artifact-name }}
      electron_version: ${{ steps.metadata.outputs.electron-version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      source_sha: ${{ steps.metadata.outputs.source-sha }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Check out the selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = require('./package.json');
          const lock = require('./package-lock.json');
          const match = /^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?$/u.exec(manifest.version);
          if (!match) throw new Error(`Unsupported package version: ${manifest.version}`);

          const event = process.env.GITHUB_EVENT_NAME;
          const ref = process.env.GITHUB_REF;
          const expectedTag = `v${manifest.version}`;
          if (event === 'workflow_dispatch' && ref !== 'refs/heads/main') {
            throw new Error('Manual trusted release runs must use main.');
          }
          if (event === 'push' && ref !== `refs/tags/${expectedTag}`) {
            throw new Error(`The release tag must be ${expectedTag}.`);
          }
          if (event !== 'workflow_dispatch' && event !== 'push') {
            throw new Error(`Unsupported release event: ${event}`);
          }

          const electronVersion = lock.packages?.['node_modules/electron']?.version;
          if (lock.version !== manifest.version || lock.packages?.['']?.version !== manifest.version) {
            throw new Error('package-lock.json does not match package.json.');
          }
          if (!/^\d+\.\d+\.\d+$/u.test(electronVersion ?? '')) {
            throw new Error('The lockfile has no exact Electron version.');
          }
          if (!/^\d+$/u.test(process.env.GITHUB_RUN_NUMBER ?? '')) {
            throw new Error('The workflow run number is not numeric.');
          }

          const values = {
            version: manifest.version,
            'numeric-version': `${match[1]}.${match[2]}.${match[3]}`,
            'bundle-version': process.env.GITHUB_RUN_NUMBER,
            'artifact-name': `Task-Monki-${manifest.version}-mac-arm64.dmg`,
            'electron-version': electronVersion,
            prerelease: String(Boolean(match[4])),
            'source-sha': process.env.GITHUB_SHA,
            tag: event === 'push' ? expectedTag : ''
          };
          const output = Object.entries(values)
            .map(([name, value]) => `${name}=${value}`)
            .join('\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output}\n`);
          NODE

      - name: Require a commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require a new release tag
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/release-lookup-error"
          set +e
          gh api --silent "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>"$error_file"
          lookup_status=$?
          set -e
          if [ "$lookup_status" -eq 0 ]; then
            echo "A GitHub Release already exists for $RELEASE_TAG." >&2
            exit 1
          fi
          if ! grep -q 'HTTP 404' "$error_file"; then
            cat "$error_file" >&2
            exit "$lookup_status"
          fi
          rm -f "$error_file"

  build_sign_notarize:
    name: Build, sign, and notarize
    needs: validate_source
    runs-on: macos-15
    timeout-minutes: 360
    environment: release
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.final_digest.outputs.sha256 }}
      submission_id: ${{ steps.notary.outputs.submission-id }}
    env:
      DMG_PATH: release/${{ needs.validate_source.outputs.artifact_name }}
      CHECKSUM_PATH: release/${{ needs.validate_source.outputs.artifact_name }}.sha256
      MACOS_BUNDLE_SHORT_VERSION: ${{ needs.validate_source.outputs.numeric_version }}
      MACOS_BUNDLE_VERSION: ${{ needs.validate_source.outputs.bundle_version }}
      EXPECTED_IDENTITY: "Developer ID Application: rojhat toptamus (ZD35XP4V7D)"
      EXPECTED_TEAM_ID: ZD35XP4V7D
      EXPECTED_DMG_IDENTIFIER: dev.taskmonki.desktop.dmg
    steps:
      - name: Check out the validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate_source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the source commit
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate_source.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" origin/main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the repository
        run: npm run verify

      - name: Prepare the arm64 Design browser runtime
        run: npm run prepare:design-browser-runtime -- --arch=arm64

      - name: Import the certificate and create the signed DMG
        id: sign
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          SIGNING_KEYCHAIN="$RUNNER_TEMP/task-monki-signing.keychain-db"
          KEYCHAIN_LIST_BACKUP="$RUNNER_TEMP/task-monki-keychain-list.txt"
          CERTIFICATE_PATH="$RUNNER_TEMP/task-monki-certificate.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/task-monki-certificate.pem"
          export SIGNING_KEYCHAIN KEYCHAIN_LIST_BACKUP CERTIFICATE_PATH CERTIFICATE_PEM

          restore_keychains() {
            local keychain
            local keychains=()
            while IFS= read -r keychain; do
              if [ -n "$keychain" ]; then keychains+=("$keychain"); fi
            done < "$KEYCHAIN_LIST_BACKUP"
            security list-keychains -d user -s "${keychains[@]}"
          }

          cleanup() {
            local result=$?
            local cleanup_result=0
            trap - EXIT
            set +e
            rm -f "$CERTIFICATE_PATH" "$CERTIFICATE_PEM" || cleanup_result=1
            if [ -f "$KEYCHAIN_LIST_BACKUP" ]; then
              restore_keychains || cleanup_result=1
            fi
            if [ -f "$SIGNING_KEYCHAIN" ]; then
              security lock-keychain "$SIGNING_KEYCHAIN" || cleanup_result=1
              security delete-keychain "$SIGNING_KEYCHAIN" || cleanup_result=1
            fi
            rm -f "$KEYCHAIN_LIST_BACKUP" || cleanup_result=1
            if [ "$result" -eq 0 ] && [ "$cleanup_result" -ne 0 ]; then result=1; fi
            exit "$result"
          }
          trap cleanup EXIT

          security list-keychains -d user |
            sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//' > "$KEYCHAIN_LIST_BACKUP"
          keychain_password="$(openssl rand -base64 32)"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"

          printf '%s' "$MACOS_CERTIFICATE_P12" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -x \
            -T /usr/bin/codesign
          rm -f "$CERTIFICATE_PATH"
          unset MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$SIGNING_KEYCHAIN"

          original_keychains=()
          while IFS= read -r keychain; do
            if [ -n "$keychain" ]; then original_keychains+=("$keychain"); fi
          done < "$KEYCHAIN_LIST_BACKUP"
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "${original_keychains[@]}"

          identity_count="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" |
            grep -F -c "\"$EXPECTED_IDENTITY\"" || true)"
          if [ "$identity_count" -ne 1 ]; then
            echo "The temporary keychain does not contain exactly one required identity." >&2
            exit 1
          fi
          identity_hash="$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN" |
            awk -v identity="$EXPECTED_IDENTITY" 'index($0, "\"" identity "\"") { print $2 }')"
          if [[ ! "$identity_hash" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo "The required signing identity has an invalid hash." >&2
            exit 1
          fi

          security find-certificate -c "$EXPECTED_IDENTITY" -p "$SIGNING_KEYCHAIN" > "$CERTIFICATE_PEM"
          openssl x509 -in "$CERTIFICATE_PEM" -noout -checkend 0
          certificate_subject="$(openssl x509 -in "$CERTIFICATE_PEM" -noout -subject -nameopt RFC2253)"
          if [[ "$certificate_subject" != *"CN=$EXPECTED_IDENTITY"* ]] ||
             [[ "$certificate_subject" != *"OU=$EXPECTED_TEAM_ID"* ]]; then
            echo "The imported certificate subject or Team ID is invalid." >&2
            exit 1
          fi
          rm -f "$CERTIFICATE_PEM"

          export CSC_KEYCHAIN="$SIGNING_KEYCHAIN"
          npm run dist:mac:trusted
          if [ ! -f "$DMG_PATH" ] || [ -L "$DMG_PATH" ]; then
            echo "The trusted DMG was not created at the expected path." >&2
            exit 1
          fi
          codesign \
            --force \
            --sign "$identity_hash" \
            --keychain "$SIGNING_KEYCHAIN" \
            --timestamp \
            --identifier "$EXPECTED_DMG_IDENTIFIER" \
            "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"

          pre_staple_sha="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          echo "pre-staple-sha=$pre_staple_sha" >> "$GITHUB_OUTPUT"

      - name: Exercise the signed packaged runtime
        run: |
          npm run verify:packaged-runtime
          npm run verify:packaged-owned-process
          npm run verify:packaged-preview-safe-storage

      - name: Submit to Apple and wait
        id: notary
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          PRE_STAPLE_SHA: ${{ steps.sign.outputs.pre-staple-sha }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          API_KEY_PATH="$RUNNER_TEMP/task-monki-notary-key.p8"
          wait_result="$RUNNER_TEMP/notary-wait.json"
          notary_log="$GITHUB_WORKSPACE/release/notary-log.json"

          cleanup_api_key() {
            rm -f "$API_KEY_PATH"
          }
          trap cleanup_api_key EXIT
          printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"

          submit_json="$(xcrun notarytool submit "$DMG_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --no-wait \
            --output-format json)"
          submission_id="$(printf '%s' "$submit_json" | jq -er '.id')"
          if [[ ! "$submission_id" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "Apple returned an invalid notarization submission ID." >&2
            exit 1
          fi
          echo "submission-id=$submission_id" >> "$GITHUB_OUTPUT"
          echo "Apple notarization submission: $submission_id"
          echo "Apple notarization submission: $submission_id" >> "$GITHUB_STEP_SUMMARY"

          set +e
          xcrun notarytool wait "$submission_id" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --timeout 240m \
            --output-format json > "$wait_result"
          wait_status=$?
          rm -f "$notary_log"
          xcrun notarytool log "$submission_id" "$notary_log" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          log_status=$?
          set -e

          cleanup_api_key
          trap - EXIT
          unset APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID

          current_sha="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          if [ "$current_sha" != "$PRE_STAPLE_SHA" ]; then
            echo "The signed DMG changed after Apple submission." >&2
            exit 1
          fi
          if [ "$wait_status" -ne 0 ]; then
            cat "$wait_result" >&2
            exit "$wait_status"
          fi
          wait_id="$(jq -er '.id' "$wait_result")"
          if [ "$wait_id" != "$submission_id" ]; then
            echo "Apple returned a different notarization submission ID." >&2
            exit 1
          fi
          status="$(jq -er '.status' "$wait_result")"
          if [ "$status" != "Accepted" ]; then
            echo "Apple returned notarization status: $status" >&2
            exit 1
          fi
          if [ "$log_status" -ne 0 ]; then
            echo "Apple accepted the DMG, but its diagnostic log is unavailable." >&2
          fi

      - name: Upload the Apple notarization log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarization-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/notary-log.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: false

      - name: Staple and validate the DMG
        shell: bash
        run: |
          set -euo pipefail
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Generate the final checksum
        id: final_digest
        shell: bash
        env:
          EXPECTED_DMG_NAME: ${{ needs.validate_source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          final_sha="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          printf '%s  %s\n' "$final_sha" "$EXPECTED_DMG_NAME" > "$CHECKSUM_PATH"
          echo "sha256=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Verify the stapled DMG
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate_source.outputs.version }}
          BUNDLE_VERSION: ${{ needs.validate_source.outputs.bundle_version }}
          ELECTRON_VERSION: ${{ needs.validate_source.outputs.electron_version }}
          EXPECTED_SHA256: ${{ steps.final_digest.outputs.sha256 }}
        run: |
          set -euo pipefail
          node scripts/verify-trusted-mac-release.mjs \
            --dmg="$DMG_PATH" \
            --version="$RELEASE_VERSION" \
            --bundle-version="$BUNDLE_VERSION" \
            --electron-version="$ELECTRON_VERSION" \
            --sha256="$EXPECTED_SHA256"

      - name: Stage the internal artifact
        shell: bash
        env:
          INTERNAL_ARTIFACT_DIR: ${{ runner.temp }}/task-monki-internal-artifact
          EXPECTED_DMG_NAME: ${{ needs.validate_source.outputs.artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p "$INTERNAL_ARTIFACT_DIR"
          cp "$DMG_PATH" "$INTERNAL_ARTIFACT_DIR/$EXPECTED_DMG_NAME"
          cp "$CHECKSUM_PATH" "$INTERNAL_ARTIFACT_DIR/$EXPECTED_DMG_NAME.sha256"
          entry_count="$(find "$INTERNAL_ARTIFACT_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          file_count="$(find "$INTERNAL_ARTIFACT_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$entry_count" -eq 2
          test "$file_count" -eq 2

      - name: Upload the trusted internal artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/task-monki-internal-artifact/${{ needs.validate_source.outputs.artifact_name }}
            ${{ runner.temp }}/task-monki-internal-artifact/${{ needs.validate_source.outputs.artifact_name }}.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

      - name: Final credential cleanup
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          SIGNING_KEYCHAIN="$RUNNER_TEMP/task-monki-signing.keychain-db"
          KEYCHAIN_LIST_BACKUP="$RUNNER_TEMP/task-monki-keychain-list.txt"
          CERTIFICATE_PATH="$RUNNER_TEMP/task-monki-certificate.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/task-monki-certificate.pem"
          API_KEY_PATH="$RUNNER_TEMP/task-monki-notary-key.p8"
          rm -f "$CERTIFICATE_PATH" "$CERTIFICATE_PEM" "$API_KEY_PATH" || cleanup_failed=1
          if [ -f "$KEYCHAIN_LIST_BACKUP" ]; then
            keychains=()
            while IFS= read -r keychain; do
              if [ -n "$keychain" ]; then keychains+=("$keychain"); fi
            done < "$KEYCHAIN_LIST_BACKUP"
            security list-keychains -d user -s "${keychains[@]}" || cleanup_failed=1
          fi
          if [ -f "$SIGNING_KEYCHAIN" ]; then
            security lock-keychain "$SIGNING_KEYCHAIN" || cleanup_failed=1
            security delete-keychain "$SIGNING_KEYCHAIN" || cleanup_failed=1
          fi
          rm -f "$KEYCHAIN_LIST_BACKUP" || cleanup_failed=1
          exit "$cleanup_failed"

  verify_internal:
    name: Verify the internal artifact
    needs: [validate_source, build_sign_notarize]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DMG_NAME: ${{ needs.validate_source.outputs.artifact_name }}
      EXPECTED_SHA256: ${{ needs.build_sign_notarize.outputs.sha256 }}
    steps:
      - name: Check out the verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate_source.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"

      - name: Download the exact internal artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build_sign_notarize.outputs.artifact_id }}
          path: ${{ runner.temp }}/task-monki-internal-download
          merge-multiple: true

      - name: Verify the downloaded artifact
        shell: bash
        env:
          DOWNLOAD_DIR: ${{ runner.temp }}/task-monki-internal-download
          RELEASE_VERSION: ${{ needs.validate_source.outputs.version }}
          BUNDLE_VERSION: ${{ needs.validate_source.outputs.bundle_version }}
          ELECTRON_VERSION: ${{ needs.validate_source.outputs.electron_version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          entry_count="$(find "$DOWNLOAD_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          file_count="$(find "$DOWNLOAD_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$entry_count" -eq 2
          test "$file_count" -eq 2
          dmg_path="$DOWNLOAD_DIR/$DMG_NAME"
          checksum_path="$DOWNLOAD_DIR/$DMG_NAME.sha256"
          actual_sha="$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA256"
          test "$(cat "$checksum_path")" = "$EXPECTED_SHA256  $DMG_NAME"
          node scripts/verify-trusted-mac-release.mjs \
            --dmg="$dmg_path" \
            --version="$RELEASE_VERSION" \
            --bundle-version="$BUNDLE_VERSION" \
            --electron-version="$ELECTRON_VERSION" \
            --sha256="$EXPECTED_SHA256"

  publish_release:
    name: Publish the GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate_source, build_sign_notarize, verify_internal]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DMG_NAME: ${{ needs.validate_source.outputs.artifact_name }}
      EXPECTED_SHA256: ${{ needs.build_sign_notarize.outputs.sha256 }}
      RELEASE_TAG: ${{ needs.validate_source.outputs.tag }}
      SOURCE_SHA: ${{ needs.validate_source.outputs.source_sha }}
      PRERELEASE: ${{ needs.validate_source.outputs.prerelease }}
    steps:
      - name: Download the verified internal artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build_sign_notarize.outputs.artifact_id }}
          path: ${{ runner.temp }}/task-monki-publish-download
          merge-multiple: true

      - name: Publish the verified DMG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOAD_DIR: ${{ runner.temp }}/task-monki-publish-download
        run: |
          set -euo pipefail
          entry_count="$(find "$DOWNLOAD_DIR" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          file_count="$(find "$DOWNLOAD_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$entry_count" -eq 2
          test "$file_count" -eq 2
          dmg_path="$DOWNLOAD_DIR/$DMG_NAME"
          checksum_path="$DOWNLOAD_DIR/$DMG_NAME.sha256"
          actual_sha="$(sha256sum "$dmg_path" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA256"
          test "$(cat "$checksum_path")" = "$EXPECTED_SHA256  $DMG_NAME"
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$tag_commit" = "$SOURCE_SHA"

          release_options=(
            "$RELEASE_TAG"
            "$dmg_path"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --generate-notes
            --title "Task Monki $RELEASE_TAG"
          )
          if [ "$PRERELEASE" = "true" ]; then release_options+=(--prerelease); fi
          gh release create "${release_options[@]}"

  verify_public:
    name: Verify the public artifact
    needs: [validate_source, build_sign_notarize, publish_release]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    env:
      DMG_NAME: ${{ needs.validate_source.outputs.artifact_name }}
      EXPECTED_SHA256: ${{ needs.build_sign_notarize.outputs.sha256 }}
      RELEASE_TAG: ${{ needs.validate_source.outputs.tag }}
    steps:
      - name: Check out the verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate_source.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"

      - name: Require one immutable public asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          asset_count="$(printf '%s' "$release_json" | jq '.assets | length')"
          asset_name="$(printf '%s' "$release_json" | jq -r '.assets[0].name')"
          immutable="$(printf '%s' "$release_json" | jq -r '.immutable')"
          test "$asset_count" -eq 1
          test "$asset_name" = "$DMG_NAME"
          test "$immutable" = "true"

      - name: Download the public DMG without authentication
        shell: bash
        env:
          PUBLIC_DIR: ${{ runner.temp }}/task-monki-public-download
        run: |
          set -euo pipefail
          mkdir -p "$PUBLIC_DIR"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$PUBLIC_DIR/$DMG_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$DMG_NAME"

      - name: Verify public integrity and trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_DIR: ${{ runner.temp }}/task-monki-public-download
          RELEASE_VERSION: ${{ needs.validate_source.outputs.version }}
          BUNDLE_VERSION: ${{ needs.validate_source.outputs.bundle_version }}
          ELECTRON_VERSION: ${{ needs.validate_source.outputs.electron_version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          dmg_path="$PUBLIC_DIR/$DMG_NAME"
          actual_sha="$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA256"
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release verify-asset "$RELEASE_TAG" "$dmg_path" --repo "$GITHUB_REPOSITORY"
          node scripts/verify-trusted-mac-release.mjs \
            --dmg="$dmg_path" \
            --version="$RELEASE_VERSION" \
            --bundle-version="$BUNDLE_VERSION" \
            --electron-version="$ELECTRON_VERSION" \
            --sha256="$EXPECTED_SHA256"
