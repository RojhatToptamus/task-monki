name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run check:themes
      - run: npm run check:codex-protocol
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:renderer:dom
      - run: npm run build
      - name: Prepare Design browser runtime
        if: runner.os == 'macOS'
        run: npm run prepare:design-browser-runtime
      - name: Build unpacked native package
        run: npm exec electron-builder -- --dir
        env:
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' }}
      - name: Smoke test packaged runtime
        run: npm run verify:packaged-runtime
      - name: Verify packaged owned-process launch
        if: runner.os == 'macOS'
        run: npm run verify:packaged-owned-process
      - name: Verify packaged Preview launcher
        if: runner.os == 'macOS'
        run: npm run verify:packaged-preview
