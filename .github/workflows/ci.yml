name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm run check:themes
      - run: npm run check:codex-protocol
      - run: npm run check:architecture
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:renderer:dom
      - run: npm run build
      - name: Prepare Design browser runtime
        if: runner.os == 'macOS'
        run: npm run prepare:design-browser-runtime
      - name: Build unpacked native package
        run: npm exec electron-builder -- --dir
        env:
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' }}
      - name: Smoke test packaged runtime
        run: npm run verify:packaged-runtime
