name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Prepare Electron runtime
        run: npm run prepare:electron-runtime
      - run: npm run check:themes
      - run: npm run check:codex-protocol
      - run: npm run check:architecture
      - run: npm run typecheck
      # Temporary diagnostic: compare storage locations before changing test configuration.
      - name: Measure Windows temporary storage
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs/promises');
          const os = require('node:os');
          const path = require('node:path');
          const { DatabaseSync } = require('node:sqlite');
          const { performance } = require('node:perf_hooks');
          const summarize = (values) => ({
            count: values.length,
            totalMs: Number(values.reduce((sum, value) => sum + value, 0).toFixed(1)),
            maxMs: Number(Math.max(...values).toFixed(1))
          });
          (async () => {
            if (!process.env.RUNNER_TEMP) throw new Error('RUNNER_TEMP is unavailable.');
            const locations = await Promise.all([
              { name: 'os.tmpdir', directory: os.tmpdir() },
              { name: 'RUNNER_TEMP', directory: process.env.RUNNER_TEMP }
            ].map(async (location) => {
              const canonicalPath = await fs.realpath(location.directory);
              return { ...location, canonicalPath, volume: path.parse(canonicalPath).root };
            }));
            console.log(JSON.stringify({
              locations,
              sameDirectory: locations[0].canonicalPath.toLowerCase() === locations[1].canonicalPath.toLowerCase()
            }));
            const payload = 'x'.repeat(1024);
            for (const [round, order] of [[0, 1], [1, 0]].entries()) {
              for (const index of order) {
                const location = locations[index];
                console.log(JSON.stringify({ phase: 'start', round: round + 1, location: location.name }));
                const directory = await fs.mkdtemp(path.join(location.directory, 'task-monki-io-probe-'));
                let database;
                try {
                  const setupStarted = performance.now();
                  database = new DatabaseSync(path.join(directory, 'probe.sqlite3'));
                  database.exec('PRAGMA journal_mode = DELETE; PRAGMA synchronous = EXTRA; CREATE TABLE probe (id INTEGER PRIMARY KEY, payload TEXT NOT NULL);');
                  const setupMs = Number((performance.now() - setupStarted).toFixed(1));
                  const insert = database.prepare('INSERT INTO probe (id, payload) VALUES (?, ?)');
                  const transactions = [];
                  for (let id = 0; id < 30; id += 1) {
                    const started = performance.now();
                    database.exec('BEGIN IMMEDIATE');
                    insert.run(id, payload);
                    database.exec('COMMIT');
                    transactions.push(performance.now() - started);
                  }
                  const files = [];
                  for (let id = 0; id < 30; id += 1) {
                    const started = performance.now();
                    const file = await fs.open(path.join(directory, `file-${id}`), 'wx');
                    try { await file.writeFile(payload); await file.sync(); }
                    finally { await file.close(); }
                    files.push(performance.now() - started);
                  }
                  console.log(JSON.stringify({
                    phase: 'measured', round: round + 1, location: location.name, setupMs,
                    journal: database.prepare('PRAGMA journal_mode').get().journal_mode,
                    synchronous: database.prepare('PRAGMA synchronous').get().synchronous,
                    transactions: summarize(transactions), syncedFiles: summarize(files)
                  }));
                } finally {
                  const cleanupStarted = performance.now();
                  try { database?.close(); }
                  finally { await fs.rm(directory, { recursive: true, force: true, maxRetries: 2, retryDelay: 100 }); }
                  console.log(JSON.stringify({ phase: 'cleaned', round: round + 1, location: location.name, cleanupMs: Number((performance.now() - cleanupStarted).toFixed(1)) }));
                }
              }
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run focused tests
        run: npm run test:focused
      - name: Run integration tests
        if: runner.os == 'Linux'
        run: npm run test:integration
      - name: Run macOS app integration tests
        if: runner.os == 'macOS'
        run: >-
          npm exec vitest -- run
          src/core/app/TaskManagerService.design.integration.test.ts
          src/core/app/TaskManagerService.preview.integration.test.ts
          src/core/preview/PreviewReconciler.integration.test.ts
      - name: Run macOS native launcher tests
        if: runner.os == 'macOS'
        run: npm exec vitest -- run src/core/preview/runtime/NativeLauncherHost.integration.test.ts
      - name: Run Windows storage integration tests
        if: runner.os == 'Windows'
        run: npm exec vitest -- run src/core/storage/SqliteTaskStore.integration.test.ts
      - name: Run system tests
        if: runner.os == 'Linux'
        run: npm run test:system
      - run: npm run test:renderer:dom
      - run: npm run build
      - name: Prepare Design browser runtime
        if: runner.os == 'macOS'
        run: npm run prepare:design-browser-runtime
      - name: Build unpacked native package
        run: npm exec electron-builder -- --dir --publish never
        env:
          # electron-builder otherwise skips the ad-hoc macOS pass for PRs.
          # The checked-in mac config and signer both force identity "-".
          CSC_FOR_PULL_REQUEST: ${{ runner.os == 'macOS' }}
      - name: Smoke test packaged runtime
        run: npm run verify:packaged-runtime
      - name: Verify packaged owned-process launch
        if: runner.os == 'macOS'
        run: npm run verify:packaged-owned-process
      - name: Verify packaged Preview launcher
        if: runner.os == 'macOS'
        run: npm run verify:packaged-preview
      - name: Verify packaged private-input persistence
        if: runner.os == 'macOS'
        run: npm run verify:packaged-preview-safe-storage
