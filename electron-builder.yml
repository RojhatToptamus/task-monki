appId: dev.taskmonki.desktop
productName: Task Monki
copyright: Copyright © 2026 Task Monki contributors

directories:
  buildResources: build
  output: release

files:
  - dist-electron/core/**
  - dist-electron/electron/**
  - dist-electron/shared/**
  - dist-renderer/**
  - package.json

extraResources:
  - from: resources/design-skills
    to: design-skills
  - from: src/core/preview/runtime/native-preview-launcher.mjs
    to: native-preview-launcher.mjs
  - from: src/core/preview/runtime/managed-design-static-server.mjs
    to: managed-design-static-server.mjs
  - from: src/core/process/owned-process-launcher.mjs
    to: owned-process-launcher.mjs
  - from: build/icon.png
    to: icon.png
  - from: LICENSE
    to: legal/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: THIRD_PARTY_LICENSES/OpenAI-Codex-Apache-2.0.txt
    to: legal/third-party/OpenAI-Codex-Apache-2.0.txt
  - from: THIRD_PARTY_LICENSES/Claude-Design-System-MIT.txt
    to: legal/third-party/Claude-Design-System-MIT.txt
  - from: node_modules/electron/dist/LICENSE
    to: legal/electron/LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: legal/electron/LICENSES.chromium.html

extraMetadata:
  main: dist-electron/electron/main.js

artifactName: Task-Monki-${version}-${os}-${arch}.${ext}
asar: true
compression: maximum
npmRebuild: false
generateUpdatesFilesForAllChannels: false

publish:
  provider: github
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Unsigned alpha builds are ad-hoc signed only. Enable Hardened Runtime with
  # the future Developer ID signed and notarized release path.
  identity: "-"
  hardenedRuntime: false
  sign: scripts/ad-hoc-mac-sign.cjs
  extendInfo:
    NSBluetoothAlwaysUsageDescription: Task Monki does not use Bluetooth access.
    NSBluetoothPeripheralUsageDescription: Task Monki does not use Bluetooth access.
    NSCameraUsageDescription: Task Monki does not use camera access.
    NSMicrophoneUsageDescription: Task Monki does not use microphone access.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  sign: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Development
  icon: build/icons
  maintainer: Task Monki contributors
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
